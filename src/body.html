<script>
  // Magic → Classic: the highlight slides to the page, then the map fades like a print in the sun and the paper
  // bleaches to white from the middle outwards; the classic home then comes up out of the white, with no loading screen.
  const modeBtn = document.querySelector('.btn.mode')
  modeBtn.addEventListener('click', e => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return
    e.preventDefault()
    const href = modeBtn.href
    modeBtn.classList.add('flip')
    try { sessionStorage.setItem('mode-arrive', '1') } catch (_) {}
    setTimeout(() => {
      const v = document.createElement('div'); v.className = 'mode-bleach'; document.body.appendChild(v)
      v.animate([{ '--p': 0 }, { '--p': 1 }], { duration: 950, easing: 'cubic-bezier(.5, 0, .3, 1)', fill: 'forwards' })
      setTimeout(() => { location.href = href }, 1050)
    }, 260)
  })
  addEventListener('pageshow', () => { modeBtn.classList.remove('flip'); document.querySelectorAll('.mode-bleach').forEach(v => v.remove()) })
</script>
